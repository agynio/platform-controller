apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform-controller.fullname" . }}
  labels:
{{ include "platform-controller.labels" . | indent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
{{ include "platform-controller.selectorLabels" . | indent 6 }}
  template:
    metadata:
      labels:
{{ include "platform-controller.selectorLabels" . | indent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
{{ toYaml . | indent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "platform-controller.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      securityContext:
{{ toYaml .Values.podSecurityContext | indent 8 }}
      containers:
        - name: platform-controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
{{ toYaml .Values.securityContext | indent 12 }}
          env:
            - name: GATEWAY_URL
              value: {{ .Values.gateway.url | quote }}
            - name: ZITI_MANAGEMENT_TARGET
              value: {{ .Values.zitiManagement.target | quote }}
            - name: BOOTSTRAP_TOKEN_FILE
              value: /etc/agyn/bootstrap/{{ .Values.bootstrapToken.key }}
            - name: WATCH_NAMESPACE
              value: {{ .Release.Namespace }}
          volumeMounts:
            - name: bootstrap-token
              mountPath: /etc/agyn/bootstrap
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
        # Mounted rather than read from the environment: the kubelet refreshes a
        # mounted Secret in place, so rotating the token does not need a restart
        # of this workload.
        - name: bootstrap-token
          secret:
            secretName: {{ .Values.bootstrapToken.secretName }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
      {{- end }}
