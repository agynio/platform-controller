---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: overlaypolicies.platform.agyn.io
spec:
  group: platform.agyn.io
  names:
    kind: OverlayPolicy
    listKind: OverlayPolicyList
    plural: overlaypolicies
    shortNames:
    - ploverlay
    singular: overlaypolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.appliedPolicies[*]
      name: Applied
      priority: 1
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              OverlayPolicySpec declares the platform's baseline OpenZiti connectivity.

              The one kind not reconciled against the platform API: these are configuration
              on the OpenZiti controller rather than platform resources. They are declared
              alongside the rest because their failure mode is identical — OpenZiti denies
              by default, so a missing policy makes a service invisible rather than refused
              — and because a policy naming a service cannot be applied until that service
              exists, which is exactly the kind of "not yet" reconciliation absorbs.
            properties:
              policies:
                items:
                  description: |-
                    ServicePolicy is written against role attributes rather than named services,
                    so a rule covers every runner and app registered later and nothing has to be
                    reapplied when one is.
                  properties:
                    identityRoles:
                      items:
                        type: string
                      minItems: 1
                      type: array
                    name:
                      minLength: 1
                      type: string
                    serviceRoles:
                      items:
                        type: string
                      minItems: 1
                      type: array
                    type:
                      enum:
                      - Dial
                      - Bind
                      type: string
                  required:
                  - identityRoles
                  - name
                  - serviceRoles
                  - type
                  type: object
                minItems: 1
                type: array
              services:
                description: |-
                  Services the platform binds and dials over the overlay. Declared here
                  with the policies because a policy naming one cannot be applied until it
                  exists, and both are overlay configuration rather than platform
                  resources.
                items:
                  description: |-
                    OverlayService is a service the platform hosts on the overlay. Its intercept
                    config is what tells a dialing tunneler which address to capture.
                  properties:
                    intercept:
                      properties:
                        addresses:
                          items:
                            type: string
                          minItems: 1
                          type: array
                        portRanges:
                          items:
                            properties:
                              high:
                                format: int32
                                maximum: 65535
                                minimum: 1
                                type: integer
                              low:
                                format: int32
                                maximum: 65535
                                minimum: 1
                                type: integer
                            required:
                            - high
                            - low
                            type: object
                          minItems: 1
                          type: array
                        protocols:
                          default:
                          - tcp
                          items:
                            type: string
                          type: array
                      required:
                      - addresses
                      - portRanges
                      type: object
                    name:
                      minLength: 1
                      type: string
                    roleAttributes:
                      items:
                        type: string
                      type: array
                  required:
                  - name
                  type: object
                type: array
            required:
            - policies
            type: object
          status:
            properties:
              appliedPolicies:
                description: |-
                  AppliedPolicies names the policies that exist on the overlay, so a
                  declaration blocked on one service still reports the rest as done.
                items:
                  type: string
                type: array
              appliedServices:
                description: AppliedServices names the services that exist on the
                  overlay.
                items:
                  type: string
                type: array
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the spec generation this status
                  describes.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
